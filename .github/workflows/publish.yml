name: Publish to Maven Central

# Publishes to Maven Central (Sonatype Central Portal) when a v-prefixed tag
# is pushed (e.g. v0.0.2). Optionally trigger manually from the Actions tab.
#
# Required GitHub secrets (one-time setup):
#   MAVEN_USERNAME   - user token name from https://central.sonatype.com/account
#   MAVEN_PASSWORD   - user token password from the same page
#   GPG_PRIVATE_KEY  - ASCII-armored private key:
#                        gpg --export-secret-keys --armor <KEY_ID>
#   GPG_PASSPHRASE   - passphrase for the GPG key
#
# Maven Central does not yet support OIDC trusted publishing, so credentials
# are stored as secrets. (Sonatype has trusted publishing on the roadmap.)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# One publish per ref at a time. GitHub can deliver a tag push more than once;
# without this, two runs race and the registry rejects the loser as a duplicate
# coordinate (seen on the v0.2.0 Maven Central release).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.newsdata/newsdataapi
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 + Maven settings + GPG
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Writes ~/.m2/settings.xml so deploys to <server id="central">
          # pick up the credentials from env vars.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify tag matches pom version
        id: version
        run: |
          POM_VERSION="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$POM_VERSION" != "$TAG" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '$TAG') does not match pom.xml version '$POM_VERSION'"
            exit 1
          fi
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing newsdataapi $POM_VERSION"

      # Maven Central coordinates are immutable: re-uploading a version that is
      # already released always fails with "Component with package url ...
      # already exists". Re-running this job (to inspect logs, or after an
      # unrelated hiccup) would therefore go red on a release that shipped
      # perfectly well. Detect that case and skip the deploy instead.
      - name: Skip if this version is already on Maven Central
        id: published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://repo1.maven.org/maven2/io/newsdata/newsdataapi/${VERSION}/newsdataapi-${VERSION}.pom"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL")"
          if [ "$CODE" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::io.newsdata:newsdataapi:${VERSION} is already on Maven Central; skipping the deploy (coordinates are immutable). Bump the version to publish again."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & test
        run: mvn -B -ntp verify

      - name: Deploy to Maven Central
        if: steps.published.outputs.already != 'true'
        run: mvn -B -ntp -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
